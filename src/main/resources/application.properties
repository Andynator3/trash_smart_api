# General
spring.application.name=trash-smart-api
# ========================
# ? SERVER CONFIG
# ========================
server.port=8081




#==================================MYSQL=======================================

# Connexion MySQL via le .env
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuration Hibernate (update permet de ne pas ecraser les donnees  chaque redemarrage)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Variables JWT (si tu utilises JwtUtil avec @Value)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION}


# ========================
# ? LOGGING
# ========================
logging.level.org.springframework=INFO
logging.level.com.trashsmart=DEBUG

